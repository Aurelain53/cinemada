<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINÉ MADA VF</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e50914;
            padding-bottom: 15px;
            width: 100%;
            max-width: 600px;
        }
        h1 {
            color: #e50914;
            font-size: 2.2rem;
            letter-spacing: 1.5px;
        }
        .subtitle {
            color: #b3b3b3;
            font-size: 0.95rem;
            margin-top: 5px;
        }
        .auth-container {
            max-width: 500px;
            width: 100%;
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .auth-container h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        .auth-container p {
            color: #aaaaaa;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        input[type="text"] {
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #333;
            width: 65%;
            font-size: 1rem;
            text-transform: uppercase;
            outline: none;
        }
        button {
            padding: 12px 20px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #b80710;
        }
        .catalog {
            width: 100%;
            max-width: 600px;
        }
        .catalog-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
            border-left: 4px solid #e50914;
            padding-left: 10px;
        }
        .empty-msg {
            color: #888;
            font-style: italic;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>CINÉ MADA VF</h1>
        <p class="subtitle">Votre espace cinéma à Madagascar</p>
    </header>

    <div class="auth-container">
        <h2>Entrez votre code</h2>
        <p>Pour télécharger tous les films disponibles</p>
        <div class="input-group">
            <input type="text" placeholder="EX: CODE-1234">
            <button>Valider</button>
        </div>
    </div>

    <div class="catalog">
        <h2 class="catalog-title">Catalogue Films HD</h2>
        <p class="empty-msg">Aucun film disponible pour le moment.</p>
    </div>

</body>
  </html>
