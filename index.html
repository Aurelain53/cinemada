<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINÉ MADA</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #e50914;
            padding-bottom: 6px;
            width: 100%;
            max-width: 800px;
        }
        h1 {
            color: #e50914;
            font-size: 1.6rem;
            letter-spacing: 1px;
            font-weight: 800;
        }
        .subtitle {
            color: #b3b3b3;
            font-size: 0.75rem;
        }
        
        /* Zone Code d'accès */
        .auth-container {
            max-width: 400px;
            width: 100%;
            background-color: #1f1f1f;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .auth-container h2 {
            font-size: 1rem;
            margin-bottom: 4px;
        }
        .auth-container p {
            color: #aaaaaa;
            font-size: 0.75rem;
            margin-bottom: 10px;
        }
        .input-group {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .input-code {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            width: 60%;
            font-size: 0.85rem;
            outline: none;
            background-color: #2b2b2b;
            color: #fff;
        }
        .btn-valider {
            padding: 8px 14px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .status-msg {
            margin-top: 8px;
            font-weight: bold;
            font-size: 0.75rem;
        }

        /* Barre de Recherche Style MovieBox */
        .search-box {
            width: 100%;
            max-width: 800px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
        }
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            display: flex;
            align-items: center;
            background-color: #2a2a2a;
            border-radius: 20px;
            padding: 4px 6px 4px 14px;
            border: 1px solid #3a3a3a;
        }
        .search-icon {
            color: #888;
            font-size: 0.9rem;
            margin-right: 8px;
        }
        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }
        .search-btn-badge {
            background-color: #10b981;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Catalogue Layout (4 colonnes MovieBox) */
        .catalog {
            width: 100%;
            max-width: 800px;
        }
        .catalog-title {
            font-size: 1rem;
            margin-bottom: 10px;
            border-left: 3px solid #e50914;
            padding-left: 8px;
        }
        .film-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        @media (max-width: 480px) {
            .film-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
            }
        }

        .film-card {
            background-color: transparent;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .film-poster-wrapper {
            width: 100%;
            padding-top: 145%;
            position: relative;
            background-color: #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
        }
        .film-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge-episodes {
            position: absolute;
            bottom: 3px;
            left: 3px;
            background: #e50914;
            color: #fff;
            font-size: 0.6rem;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: bold;
        }
        .film-title {
            font-size: 0.72rem;
            margin-top: 4px;
            color: #ddd;
            line-height: 1.15;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Modal Pop-up Liste des Épisodes */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }
        @media (min-width: 600px) {
            .modal-overlay {
                align-items: center;
            }
        }
        .modal-content {
            background-color: #1f1f1f;
            width: 100%;
            max-width: 500px;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            padding: 18px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
        }
        @media (min-width: 600px) {
            .modal-content {
                border-radius: 12px;
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .modal-title {
            font-size: 1rem;
            color: #fff;
            font-weight: bold;
        }
        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.4rem;
            cursor: pointer;
        }
        .episode-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .episode-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .episode-name {
            font-size: 0.85rem;
            color: #fff;
            font-weight: 500;
        }
        .dl-btn {
            background-color: #555;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .dl-btn.unlocked {
            background-color: #28a745;
        }

        .loading, .empty-msg {
            color: #888;
            font-style: italic;
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px 0;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>CINÉ MADA</h1>
        <p class="subtitle">Votre espace cinéma à Madagascar</p>
    </header>

    <!-- Zone de Code d'accès -->
    <div id="authBox" class="auth-container">
        <h2>Entrez votre code d'accès</h2>
        <p>Pour débloquer les liens de téléchargement</p>
        <div class="input-group">
            <input type="text" id="codeInput" class="input-code" placeholder="Entrez le code ici">
            <button class="btn-valider" onclick="checkCode()">Valider</button>
        </div>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- Barre de Recherche MovieBox Style -->
    <div class="search-box">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Recherche..." onkeyup="filterFilms()">
            <button class="search-btn-badge" onclick="filterFilms()">Rechercher</button>
        </div>
    </div>

    <!-- Catalogue Films Style MovieBox -->
    <div class="catalog">
        <h2 class="catalog-title">Films & Séries HD</h2>
        <div id="filmContainer" class="film-grid">
            <p class="loading">Chargement du catalogue...</p>
        </div>
    </div>

    <!-- Pop-up Liste des Épisodes -->
    <div id="episodeModal" class="modal-overlay" onclick="closeModalOnOuterClick(event)">
        <div class="modal-content">
            <div class="modal-header">
                <div id="modalTitle" class="modal-title">Titre du Film</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="episodeListContainer" class="episode-list">
                <!-- Les épisodes s'affichent ici -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://daoagqgxfzlsocukldph.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_kElDNa1IH0EkbzDVLNGxbg_ns1byA19';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isCodeValid = false;
        let groupedFilms = {}; 

        function getBaseTitle(title) {
            return title.replace(/\s+(partie|part|épisode|ep|vol|volume|\d+)$/i, '').trim();
        }

        async function fetchFilms() {
            const container = document.getElementById('filmContainer');
            
            const { data: films, error } = await _supabase
                .from('films')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                console.error("Erreur:", error);
                container.innerHTML = '<p class="empty-msg">Erreur de chargement. Veuillez réactualiser.</p>';
                return;
            }

            if (!films || films.length === 0) {
                container.innerHTML = '<p class="empty-msg">Aucun film disponible.</p>';
                return;
            }

            groupedFilms = {};
            films.forEach(film => {
                const baseName = getBaseTitle(film.title);
                if (!groupedFilms[baseName]) {
                    groupedFilms[baseName] = {
                        mainTitle: baseName,
                        posterUrl: film.poster_url,
                        episodes: []
                    };
                }
                groupedFilms[baseName].episodes.push(film);
            });

            renderFilms(Object.keys(groupedFilms));
        }

        function renderFilms(keysToDisplay) {
            const container = document.getElementById('filmContainer');
            container.innerHTML = '';

            if (keysToDisplay.length === 0) {
                container.innerHTML = '<p class="empty-msg">Aucun résultat trouvé.</p>';
                return;
            }

            keysToDisplay.forEach(key => {
                const group = groupedFilms[key];
                const card = document.createElement('div');
                card.className = 'film-card';
                card.onclick = () => openModal(key);
                
                const posterImg = group.posterUrl ? group.posterUrl : 'https://via.placeholder.com/150x220?text=Pas+d+image';
                const epCount = group.episodes.length;

                card.innerHTML = `
                    <div class="film-poster-wrapper">
                        <img src="${posterImg}" alt="${group.mainTitle}" class="film-poster">
                        ${epCount > 1 ? `<span class="badge-episodes">${epCount} Éps</span>` : ''}
                    </div>
                    <div class="film-title">${group.mainTitle}</div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(groupKey) {
            const group = groupedFilms[groupKey];
            document.getElementById('modalTitle').innerText = group.mainTitle;
            
            const container = document.getElementById('episodeListContainer');
            container.innerHTML = '';

            group.episodes.forEach((ep, index) => {
                const item = document.createElement('div');
                item.className = 'episode-item';
                
                const btnClass = isCodeValid ? 'dl-btn unlocked' : 'dl-btn';
                const btnIcon = isCodeValid ? '📥 Télécharger' : '🔒 Télécharger';
                
                const epName = ep.title.length > group.mainTitle.length ? ep.title : `Épisode ${index + 1}`;

                item.innerHTML = `
                    <span class="episode-name">${epName}</span>
                    <button class="${btnClass}" onclick="downloadFilm('${ep.download_url}')">
                        ${btnIcon}
                    </button>
                `;
                container.appendChild(item);
            });

            document.getElementById('episodeModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('episodeModal').style.display = 'none';
        }

        function closeModalOnOuterClick(e) {
            if (e.target.id === 'episodeModal') {
                closeModal();
            }
        }

        // Vérification du code dans Supabase (Table: codes)
        async function checkCode() {
            const userCode = document.getElementById('codeInput').value.trim();
            const msg = document.getElementById('statusMsg');

            if (!userCode) {
                msg.style.color = '#e50914';
                msg.innerText = "⚠️ Veuillez saisir un code d'accès !";
                return;
            }

            msg.style.color = '#aaaaaa';
            msg.innerText = "Vérification en cours...";

            // Requête directe dans la table 'codes'
            const { data, error } = await _supabase
                .from('codes')
                .select('*')
                .ilike('code', userCode)
                .maybeSingle();

            if (error || !data) {
                msg.style.color = '#e50914';
                msg.innerText = "❌ Code invalide ou inexistant !";
                return;
            }

            // 1. Vérification si le code a déjà été utilisé
            if (data.is_used) {
                msg.style.color = '#e50914';
                msg.innerText = "❌ Ce code a déjà été utilisé !";
                return;
            }

            // 2. Vérification de la date d'expiration
            if (data.expires_at) {
                const now = new Date();
                const expireDate = new Date(data.expires_at);

                if (now > expireDate) {
                    msg.style.color = '#e50914';
                    msg.innerText = "❌ Ce code est expiré !";
                    return;
                }
            }

            // Validation réussie
            isCodeValid = true;
            document.getElementById('authBox').style.display = 'none';
            renderFilms(Object.keys(groupedFilms));
            alert("✅ Code validé avec succès ! Vous pouvez maintenant télécharger vos films.");
        }

        function filterFilms() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredKeys = Object.keys(groupedFilms).filter(key => 
                key.toLowerCase().includes(searchTerm)
            );
            renderFilms(filteredKeys);
        }

        function downloadFilm(url) {
            if (!isCodeValid) {
                alert("Accès refusé ! Veuillez d'abord valider votre code d'accès.");
            } else {
                window.open(url, '_blank');
            }
        }

        fetchFilms();
    </script>
</body>
  </html>
