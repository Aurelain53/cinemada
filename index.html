<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINÉ MADA VF</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e50914;
            padding-bottom: 15px;
            width: 100%;
            max-width: 600px;
        }
        h1 {
            color: #e50914;
            font-size: 2.2rem;
            letter-spacing: 1.5px;
        }
        .subtitle {
            color: #b3b3b3;
            font-size: 0.95rem;
            margin-top: 5px;
        }
        .auth-container {
            max-width: 500px;
            width: 100%;
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .auth-container h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }
        .auth-container p {
            color: #aaaaaa;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        input[type="text"] {
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #333;
            width: 65%;
            font-size: 1rem;
            text-transform: uppercase;
            outline: none;
        }
        .btn-valider {
            padding: 12px 20px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-valider:hover {
            background-color: #b80710;
        }
        .status-msg {
            margin-top: 12px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .catalog {
            width: 100%;
            max-width: 600px;
        }
        .catalog-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
            border-left: 4px solid #e50914;
            padding-left: 10px;
        }
        .film-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .film-card {
            background-color: #1f1f1f;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .film-poster {
            width: 80px;
            height: 110px;
            object-fit: cover;
            border-radius: 5px;
            background-color: #333;
        }
        .film-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .film-title {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .download-btn {
            background-color: #555555;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
            width: fit-content;
            cursor: pointer;
            border: none;
        }
        .download-btn.unlocked {
            background-color: #28a745;
        }
        .download-btn.unlocked:hover {
            background-color: #218838;
        }
        .loading, .empty-msg {
            color: #888;
            font-style: italic;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>CINÉ MADA VF</h1>
        <p class="subtitle">Votre espace cinéma à Madagascar</p>
    </header>

    <div class="auth-container">
        <h2>Entrez votre code d'accès</h2>
        <p>Pour débloquer les liens de téléchargement</p>
        <div class="input-group">
            <input type="text" id="codeInput" placeholder="EX: MADA2026">
            <button class="btn-valider" onclick="checkCode()">Valider</button>
        </div>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="catalog">
        <h2 class="catalog-title">Catalogue Films HD</h2>
        <div id="filmContainer" class="film-list">
            <p class="loading">Chargement du catalogue en cours...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://daoagqgxfzlsocukldph.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_kElDNa1IH0EkbzDVLNGxbg_ns1byA19';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isCodeValid = false;
        const CODE_VALID = "MADA2026"; 

        async function fetchFilms() {
            const container = document.getElementById('filmContainer');
            
            const { data: films, error } = await _supabase
                .from('films')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Erreur:", error);
                container.innerHTML = '<p class="empty-msg">Erreur lors du chargement des films. Veuillez réactualiser la page.</p>';
                return;
            }

            if (!films || films.length === 0) {
                container.innerHTML = '<p class="empty-msg">Aucun film disponible pour le moment.</p>';
                return;
            }

            container.innerHTML = '';
            films.forEach(film => {
                const card = document.createElement('div');
                card.className = 'film-card';
                
                const posterImg = film.poster_url ? film.poster_url : 'https://via.placeholder.com/80x110?text=Pas+d+image';
                
                card.innerHTML = `
                    <img src="${posterImg}" alt="${film.title}" class="film-poster">
                    <div class="film-info">
                        <div class="film-title">${film.title}</div>
                        <button class="download-btn" id="btn-${film.id}" onclick="downloadFilm('${film.download_url}')">
                            🔒 Télécharger
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function checkCode() {
            const userCode = document.getElementById('codeInput').value.trim().toUpperCase();
            const msg = document.getElementById('statusMsg');

            if (userCode === CODE_VALID) {
                isCodeValid = true;
                msg.style.color = "#28a745";
                msg.innerText = "✓ Code valide ! Accès aux téléchargements débloqué.";
                
                document.querySelectorAll('.download-btn').forEach(btn => {
                    btn.classList.add('unlocked');
                    btn.innerText = "📥 Télécharger";
                });
            } else {
                isCodeValid = false;
                msg.style.color = "#e50914";
                msg.innerText = "❌ Code d'accès incorrect ! Veuillez réessayer.";
            }
        }

        function downloadFilm(url) {
            if (!isCodeValid) {
                alert("Accès refusé ! Veuillez d'abord saisir un code d'accès valide ci-dessus.");
            } else {
                window.open(url, '_blank');
            }
        }

        fetchFilms();
    </script>
</body>
      </html>
